<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-button expand="block" (click)="doLogin('google')">
    <ion-icon slot="start" name="logo-google"></ion-icon>
    Sign in with Google
  </ion-button>
  <ion-button expand="block" (click)="doLogin('apple')">
    <ion-icon slot="start" name="logo-apple"></ion-icon>
    Sign in with Apple
  </ion-button>
</ion-content>
