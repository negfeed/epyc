<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <h2 class="profilename">Hello {{ userName }}!</h2>
    </ion-card-header>
    <ion-item>
      <img class="profilepic" [src]="userPhotoUrl" />
    </ion-item>
  </ion-card>
  <ion-card>
    <ion-card-header>
      <b>Last Few Games</b>
    </ion-card-header>
    <ion-list>
      <ion-item
        button
        *ngFor="let gameLink of gameLinks | async"
        (click)="goToGame(gameLink.gameInstanceReference)"
      >
        {{ gameLink.join_timestamp_ms | date: 'y/M/d h:mm a' }}
      </ion-item>
    </ion-list>
  </ion-card>
  <ion-button (click)="doNewGame()" expand="block">New Game</ion-button>
</ion-content>
